name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:worker-boundary
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      - run: npm run extraction:dry-run
      - run: npx wrangler d1 execute biomedical-hydrogen-evidence --local --file=.generated/extraction/synthetic-dry-run.sql
      - run: npm run db:plans:local

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew :app:lintDebug :app:assembleDebug
        working-directory: clients/android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          xcodebuild
          -project clients/ios/BiomedicalHydrogenEvidence.xcodeproj
          -target BiomedicalHydrogenEvidence
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
